<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('screen'),ctx=canvas.getContext('2d'),W=1000,H=630;
const SCENES={title:'titlePage',controls:'howPage',name:'namePage',nameZoom:'zoomPage',save:'savePage',failed:'failPage',question:'questionPage',letter:'letterPage'};
const ARENA={x:233,y:340,w:534,h:222},FLOOR=562,ADAM_SCALE=.48;
const keys={left:false,right:false,up:false,down:false,shoot:false};
let scene='title',clock=0,phase=0,last=0,muted=false,paused=false,sfx=null,bgmClock=0,bgmStep=0,bullets=[],rocks=[],debris=[],spark=[],boss,adam,spawn=0,shake=0,wrong=0,nickname='PLAYER',letterPages=[],letterIndex=0,queuedLetter=false,sceneTimer=null;
const rand=(a,b)=>Math.random()*(b-a)+a,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const bgmNotes=[0,7,10,7,0,7,12,7,-2,5,10,5,-5,2,7,2,0,7,12,7,3,7,10,7,-2,5,10,5,-7,0,5,0],victoryNotes=[0,4,7,12,11,7,4,0,5,9,12,16,12,9,7,4];
let ac=null,musicGain=null,fxGain=null;
function audio(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();musicGain=ac.createGain();fxGain=ac.createGain();musicGain.connect(ac.destination);fxGain.connect(ac.destination);musicGain.gain.value=.46;fxGain.gain.value=.65}if(ac.state==='suspended')ac.resume().catch(()=>{});}catch(e){ac=null}}
function beep(hz=420,d=.085,type='square',vol=.04,isMusic=false,slide=0){if(muted)return;audio();if(!ac)return;const osc=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;osc.type=type;osc.frequency.setValueAtTime(Math.max(50,hz),now);if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(50,hz+slide),now+d);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+d);osc.connect(g);g.connect(isMusic?musicGain:fxGain);osc.start(now);osc.stop(now+d+.013)}
function musicStop(sudden=false){if(bgmClock){clearInterval(bgmClock);bgmClock=0}if(musicGain&&ac&&sudden)musicGain.gain.setValueAtTime(.00001,ac.currentTime)}
function musicStart(win=false){musicStop();if(muted)return;audio();if(musicGain)musicGain.gain.value=.46;bgmStep=0;const tick=()=>{if(muted||paused||!['battle','crack','dust','victory'].includes(scene))return;const n=(win?victoryNotes:bgmNotes)[bgmStep%(win?victoryNotes:bgmNotes).length];beep(260*Math.pow(2,n/12),win?.145:.105,win?'triangle':'square',win?.048:.035,true);if(bgmStep%4===0)beep(128*Math.pow(2,[-5,-7,-2,0][Math.floor(bgmStep/8)%4]/12),.18,'triangle',.042,true);if(!win&&bgmStep%8===3)beep(920,.025,'square',.014,true,-650);bgmStep++};tick();bgmClock=setInterval(tick,win?195:170)}
function allHide(){for(const id of Object.values(SCENES))$(id).hidden=true}
function setScene(next){if(sceneTimer){clearTimeout(sceneTimer);sceneTimer=null}scene=next;phase=0;allHide();if(SCENES[next])$(SCENES[next]).hidden=false;
 // Retain the exact question-box geometry while the silent head-turn plays.
 $('questionPage').style.visibility='';
 if(next==='glitch'||next==='stare'){$('questionPage').hidden=false;$('questionPage').style.visibility='hidden'}
 $('mobilePad').hidden=!['corridor','battle'].includes(next);
 if(next==='name')setTimeout(()=>$('nickname').focus({preventScroll:true}),40);
 if(next==='question'){$('questionPrompt').textContent='『주인공은 마지막으로 당신에게 무엇을 요구할까요?』';setTimeout(()=>$('answerInput').focus({preventScroll:true}),130)}
 if(next==='failed'){musicStop(true);beep(130,.42,'sawtooth',.09,false,-88)}
 if(next==='letter'){musicStop(true);letterIndex=0;requestAnimationFrame(()=>{buildPages();showLetter()})}
}

// Each complete sentence stays on one page: no word/phrase is cut across pages.
function sentencePieces(text){
 const arr=[];let at=0;
 for(let i=0;i<text.length;i++){
  const c=text[i],next=text[i+1]||'';
  if((/[.!?。！？]/.test(c)&&(next===''||/\s/.test(next)||next==='」'))||c==='\n'){
   let j=i+1;if(c!=='\n')while(j<text.length&&/\s/.test(text[j]))j++;
   arr.push(text.slice(at,j));at=j;i=j-1;
  }
 }
 if(at<text.length)arr.push(text.slice(at));return arr.filter(Boolean)
}
function buildPages(){
 const target=$('letterText'),paper=$('letterClickZone'),sz=$('letterSizer'),comp=getComputedStyle(target),paperStyle=getComputedStyle(paper);
 const available=Math.max(85,paper.clientHeight-parseFloat(paperStyle.paddingTop)-parseFloat(paperStyle.paddingBottom)-9);
 sz.style.width=target.clientWidth+'px';sz.style.fontFamily=comp.fontFamily;sz.style.fontSize=comp.fontSize;sz.style.fontWeight=comp.fontWeight;sz.style.lineHeight=comp.lineHeight;sz.style.letterSpacing=comp.letterSpacing;
 const fits=(s)=>{sz.textContent=s;return sz.scrollHeight<=available};
 letterPages=[];
 LETTER.forEach((block,section)=>{
  const pieces=sentencePieces(block);let current='',part=0,offset=0;
  for(const piece of pieces){
   if(current&&!fits(current+piece)){
    letterPages.push({text:current,section,part:part++,offset});offset+=current.length;current='';
   }
   // Even exceptionally long sentences are preserved, not split in the middle.
   current+=piece;
  }
  if(current)letterPages.push({text:current,section,part,offset});
 });
}
function showLetter(){const rec=letterPages[letterIndex];if(!rec)return;
 const t=$('letterText');t.textContent=rec.text;t.style.fontSize='';t.style.lineHeight='';
 $('letterProgress').textContent=`${letterIndex+1} / ${letterPages.length}`;
 $('letterPrev').disabled=letterIndex===0;
 const last=letterIndex===letterPages.length-1;$('letterNext').hidden=last;$('letterEndHint').hidden=!last;
 if(last)$('letterClickZone').setAttribute('aria-label','편지 마지막 페이지');else $('letterClickZone').setAttribute('aria-label','편지 다음 페이지');
 // Handle a sentence longer than the viewport without corrupting its text.
 let size=parseFloat(getComputedStyle(t).fontSize),floor=window.innerWidth<710?10.5:12.5;
 while(t.scrollHeight>t.clientHeight+2&&size>floor){size-=.4;t.style.fontSize=size+'px'}
 if(t.scrollHeight>t.clientHeight+2){t.style.overflowY='auto'}else t.style.overflowY='hidden';
}
function nextLetter(){if(scene!=='letter'||letterIndex>=letterPages.length-1)return;beep(385,.03,'triangle',.019);letterIndex++;showLetter()}

function corridorBase(){
 rect(0,0,W,H,'#000');
 // Irregular gray rock face and cavern mouth: explicitly not a rectangular door.
 for(let i=0;i<30;i++){
  let x=i*40-8;
  let top=43+Math.floor(Math.sin(i*.75)*18),bottom=561+Math.floor(Math.cos(i*.55)*24);

 }
 for(let x=0;x<990;x+=49){rect(x,560+(x%3)*6,50,80,x%2?'#303030':'#202020');rect(x+5,573,27,3,'#555')}
 for(let i=0;i<12;i++){
  let x=35+i*76;rect(x,0,19,40+(i*19)%90,'#282828');rect(x+8,40+(i*19)%90,12,18,'#555')
 }
 const cx=808,cy=337;
 // Jagged stone silhouette around a deep dark cavity, no handles, frames or hinge.
 ctx.fillStyle='#545454';ctx.beginPath();ctx.moveTo(691,545);ctx.lineTo(684,363);ctx.lineTo(712,301);ctx.lineTo(732,239);ctx.lineTo(759,212);ctx.lineTo(790,173);ctx.lineTo(833,173);ctx.lineTo(864,201);ctx.lineTo(898,256);ctx.lineTo(924,332);ctx.lineTo(935,548);ctx.closePath();ctx.fill();
 ctx.fillStyle='#050505';ctx.beginPath();ctx.moveTo(730,546);ctx.lineTo(730,378);ctx.lineTo(745,322);ctx.lineTo(766,279);ctx.lineTo(788,252);ctx.lineTo(824,244);ctx.lineTo(849,256);ctx.lineTo(872,298);ctx.lineTo(893,357);ctx.lineTo(896,546);ctx.closePath();ctx.fill();
 for(let i=0;i<28;i++){let x=660+((i*71)%290),y=177+((i*53)%357);if(x<728||x>901||y<255||y>530){rect(x,y,7+i%4*3,4+i%3*3,i%4===0?'#999':'#686868')}}
 rect(0,539,1000,7,'#7a7a7a');rect(0,548,1000,25,'#282828');
 posText('→',809,122,35,'#f5f5f5','center');

function drawDust(){for(const p of debris){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);rect(-p.w/2,-p.h/2,p.w,p.h,'#e0dfd7');ctx.restore()}for(const p of spark){ctx.globalAlpha=clamp(p.life/p.max,0,1);rect(p.x,p.y,p.s,p.s,'#f5f3ea')}ctx.globalAlpha=1}

// The sprite remains exactly the same size in scenes 5, 6, 7, and 8.
// Scene 8 stages him just ABOVE the Undertale-style dialogue box.
function questionStageTop(){
 const screenRect=canvas.getBoundingClientRect();
 const dialog=document.querySelector('.questionBox');
 if(!document.getElementById('questionPage').hidden){
  const r=dialog.getBoundingClientRect();
  if(r.height>0 && screenRect.height>0) return (r.top-screenRect.top)*H/screenRect.height;
 }
 // In the silent transitional frames, the HTML box is still hidden.
 const mobile=matchMedia('(pointer:coarse), (max-width:710px)').matches;
 const panelHeight=mobile?195:208;
 return H*.95-panelHeight*H/Math.max(screenRect.height,1);
}
function drawCloseup(){
 rect(0,0,W,H,'#000');
 const borderY=questionStageTop();
 // A silent, empty dialogue panel remains visible while Adam turns his head.
 if(scene==='glitch'||scene==='stare'){
  const x=scene==='glitch'&&phase<.16?rand(-3,3):0;
  ctx.strokeStyle='#fff';ctx.lineWidth=4;
  ctx.strokeRect(50+x,borderY,900,H*.95-borderY);
 }
 // First truly in profile, then turning to stare with fully black eyes.
 const facingSide=(scene==='glitch'&&phase<.82);
 const tinyJitter=scene==='glitch'&&phase<.13?rand(-2,2):0;
 const feetOnBorderY=borderY-3;
 const groundY=feetOnBorderY-44*ADAM_SCALE;
 drawAdam(500+tinyJitter,groundY,{profile:facingSide,darkEyes:!facingSide,noMouth:true});
 // Only a brief, restrained black-and-white interference, never a zoom.
 if(scene==='glitch'&&phase<.18){
  for(let i=0;i<8;i++){ctx.globalAlpha=rand(.07,.2);rect(rand(0,1000),rand(30,borderY-90),rand(8,75),rand(1,3),'#d6d6d6')}
  ctx.globalAlpha=1;
 }
}
function spawnWave(){
  const a=Math.atan2(adam.y-24-(boss.y+60),adam.x-boss.x),basicY=boss.y+60;let w=Math.floor(clock*2.3)%5;const bias=Math.min(.16,(1-boss.hp/boss.max)*.16);
  if(w===0||w===3){let N=11,rot=clock*.44;for(let i=0;i<N;i++){if(i===3||i===9)continue;const ang=i*Math.PI*2/N+rot;bullets.push({x:boss.x+Math.cos(ang)*27,y:basicY+Math.sin(ang)*15,vx:Math.cos(ang)*(92+bias*90),vy:Math.sin(ang)*(108+bias*80)+55,r:6.2,kind:i%3===0})}}
  else if(w===1){for(let i=-2;i<=2;i++){let angle=a+i*.18,s=140+(2-Math.abs(i))*5+bias*80;bullets.push({x:boss.x,y:basicY,vx:Math.cos(angle)*s,vy:Math.sin(angle)*s,r:6.9,kind:false})}}
  else{for(let i=0;i<9;i++){const angle=(.3+i*(Math.PI-0.6)/8);bullets.push({x:boss.x-52+i*13,y:basicY,vx:Math.cos(angle)*(95+bias*50),vy:Math.sin(angle)*(132+bias*65),r:5.7,kind:true})}}
  beep(610,.09,'square',.045,false,-230);if(bullets.length>170)bullets.splice(0,bullets.length-170);
}
function throwStone(){const dx=boss.x-adam.x,dy=boss.y-adam.y,ang=Math.atan2(dy,dx)+rand(-.03,.03);rocks.push({x:adam.x,y:adam.y-20,vx:Math.cos(ang)*760,vy:Math.sin(ang)*760,spin:rand(0,7),life:1.4});adam.shot=.22;beep(420,.055,'triangle',.035,false,-160)}
function hurt(){if(adam.inv>0||scene!=='battle')return;adam.hp--;adam.inv=1.0;shake=12;beep(210,.23,'sawtooth',.09,false,-155);for(let i=0;i<13;i++)spark.push({x:adam.x,y:adam.y-20,vx:rand(-120,120),vy:rand(-100,100),life:.4,max:.4,s:rand(1,4)});if(adam.hp<=0)setScene('failed')}
function hitCircle(ax,ay,ar,bx,by,br){return (ax-bx)**2+(ay-by)**2<(ar+br)**2}
function win(){rocks=[];bullets=[];setScene('crack');musicStart(true);shake=4;beep(690,.24,'triangle',.08,false,-260)}
function makeDust(){debris=[];for(let i=0;i<145;i++){const angle=rand(0,Math.PI*2),r=rand(0,73),tiny=i>46;debris.push({x:boss.x+Math.cos(angle)*r,y:boss.y+Math.sin(angle)*r*.85,vx:rand(-145,145),vy:rand(-240,25),w:tiny?rand(2,4):rand(5,15),h:tiny?rand(2,4):rand(5,16),r:rand(-3,3),vr:rand(-7,7),ground:false})}shake=19;beep(170,.48,'sawtooth',.15,false,-120)}
function update(dt){clock+=dt;if(paused&&scene==='battle')return;phase+=dt;shake=Math.max(0,shake-dt*18);
 if(scene==='corridor'){if(keys.right){adam.x=clamp(adam.x+240*dt,130,870);adam.step+=dt*9}if(adam.x>800){beep(560,.16,'triangle',.07);startBattle()}}
 else if(scene==='battle'){
  const dx=Number(keys.right)-Number(keys.left),dy=Number(keys.down)-Number(keys.up),norm=Math.hypot(dx,dy)||1;
  adam.x=clamp(adam.x+dx/norm*300*dt,ARENA.x+17,ARENA.x+ARENA.w-17);
  adam.y=clamp(adam.y+dy/norm*275*dt,ARENA.y+50,ARENA.y+ARENA.h-25);
  adam.inv=Math.max(0,adam.inv-dt);adam.shot=Math.max(0,adam.shot-dt);
  boss.hurt=Math.max(0,boss.hurt-dt*3);
  if(keys.shoot&&adam.shot<=0)throwStone();spawn-=dt;if(spawn<=0){spawnWave();spawn=.74-Math.min(.2,(1-boss.hp/boss.max)*.2)}
  for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.life-=dt;r.spin+=dt*9;
    if(hitCircle(r.x,r.y,8,boss.x,boss.y,66)){rocks.splice(i,1);boss.hp--;boss.hurt=1;beep(170,.07,'triangle',.055,false,210);if(boss.hp%6===0)shake=6;if(boss.hp<=0){win();return;}}
    else if(r.life<=0||r.x<-30||r.x>W+30||r.y<0)rocks.splice(i,1)
  }
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(hitCircle(b.x,b.y,b.r,adam.x,adam.y-18,9)){bullets.splice(i,1);hurt()}else if(b.x<-50||b.x>W+50||b.y>H+50||b.y<-50)bullets.splice(i,1)}
 }
 else if(scene==='crack'&&phase>2.35){makeDust();setScene('dust')}
 else if(scene==='dust'||scene==='victory'){
  for(const p of debris){if(p.ground)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=630*dt;p.r+=p.vr*dt;if(p.y+p.h/2>FLOOR){p.y=FLOOR-p.h/2;p.vy=-Math.abs(p.vy)*.20;p.vx*=.72;if(Math.abs(p.vy)<58){p.vy=0;p.vx=0;p.ground=true;}}}
  if(scene==='dust'&&phase>3.1){setScene('victory');adam.x=500;adam.y=541;}
  else if(scene==='victory'){
    adam.jump=Math.pow(Math.max(0,Math.sin(phase*4.1)),1.15)*24;
    if(Math.floor(phase*4.1/Math.PI)!==Math.floor((phase-dt)*4.1/Math.PI))beep(490,.05,'triangle',.035,false,75);
    if(phase>8.5){musicStop(true);setScene('glitch');for(const k in keys)keys[k]=false;}
  }
 }
 else if(scene==='glitch'&&phase>1.3)setScene('stare');
 else if(scene==='stare'&&phase>1.8)setScene('question');
 for(let i=spark.length-1;i>=0;i--){const p=spark[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=230*dt;p.life-=dt;if(p.life<=0)spark.splice(i,1)}
}
function render(){ctx.clearRect(0,0,W,H);
 if(['title','controls','name','nameZoom','save','letter'].includes(scene)){rect(0,0,W,H,'#000');return}
 if(scene==='corridor'){corridorBase();return}
 if(['glitch','stare','question'].includes(scene)){drawCloseup();return}
 if(scene==='failed'){battleBase();drawSkull(500,190,1);drawAdam(adam.x,adam.y,{hurt:true});ctx.fillStyle='#000c';ctx.fillRect(0,0,W,H);return}
 ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));battleBase();
 if(scene==='battle'){drawSkull(boss.x,boss.y,1,Math.max(0,(1-boss.hp/boss.max)*.7));drawProjectiles();drawAdam(adam.x,adam.y,{hurt:adam.inv>0});drawHP()}
 else if(scene==='crack'){drawSkull(boss.x,boss.y,1,clamp(phase/2.25,0,1));drawAdam(500,541);posText('YOU WON!',500,91,31,'#eeeee6','center')}
 else if(scene==='dust'||scene==='victory'){drawDust();drawAdam(500,541,{clap:scene==='victory',jump:adam.jump||0});posText('YOU WON!',500,100,30,'#f3f2ec','center')}
 if(paused&&scene==='battle'){ctx.fillStyle='#000e';ctx.fillRect(0,0,W,H);posText('PAUSED',500,302,48,'#fff','center');posText('PRESS P TO RESUME',500,342,16,'#aaa','center')}
 ctx.restore();
}
function animate(ts){if(!last)last=ts;const dt=Math.min(.04,(ts-last)/1000);last=ts;if(!document.hidden)update(dt);render();requestAnimationFrame(animate)}
// ---- UI bindings / keyboard / touch ----
$('beginBtn').addEventListener('click',start);$('howNext').addEventListener('click',toName);$('nameOk').addEventListener('click',toSave);$('clearName').addEventListener('click',()=>{$('nickname').value='';$('nickname').focus()});$('continueBtn').addEventListener('click',toCorridor);$('retryBtn').addEventListener('click',startBattle);
$('answerForm').addEventListener('submit',submitAnswer);
$('letterNext').addEventListener('click',nextLetter);$('letterPrev').addEventListener('click',prevLetter);$('letterClickZone').addEventListener('click',nextLetter);
$('letterClickZone').addEventListener('keydown',e=>{if(e.code==='Enter'||e.code==='Space'||e.code==='KeyZ'){e.preventDefault();e.stopPropagation();nextLetter()}});
$('soundToggle').addEventListener('click',()=>{muted=!muted;$('soundToggle').textContent=muted?'♪ 소리 켜기':'♪ 소리 끄기';if(muted)musicStop(true);else if(['battle','crack','dust','victory'].includes(scene))musicStart(scene!=='battle')});
try{const save=JSON.parse(localStorage.getItem('fromA_save')||'null');if(save&&typeof save.nickname==='string')$('nickname').value=save.nickname}catch(e){}
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');for(const c of letters){const b=document.createElement('button');b.type='button';b.className='letterKey';b.textContent=c;b.setAttribute('aria-label',c);b.addEventListener('click',()=>{const input=$('nickname');input.value=(input.value+c).slice(0,12);beep(500,.035,'square',.019);input.focus({preventScroll:true})});$('letterKeys').appendChild(b)}
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'shoot',KeyJ:'shoot'};
window.addEventListener('keydown',e=>{
  if(scene==='letter'&&(e.code==='ArrowLeft'||e.code==='Backspace')){e.preventDefault();prevLetter();return}
  const typing=e.target instanceof HTMLInputElement;if(typing){if(e.code==='Enter'){e.preventDefault();if(scene==='name')toSave();else if(scene==='question')$('answerForm').requestSubmit()}return}
  if(['corridor','battle'].includes(scene)&&keyMap[e.code]){e.preventDefault();keys[keyMap[e.code]]=true}
  if(scene==='battle'&&e.code==='KeyP'&&!e.repeat){e.preventDefault();paused=!paused;if(paused)musicStop(false);else musicStart(false);return}
  if(e.repeat)return;
  if(e.code==='Enter'||e.code==='Space'||e.code==='KeyZ'){
    if(scene==='title'){e.preventDefault();start()}
    else if(scene==='controls'){e.preventDefault();toName()}
    else if(scene==='save'){e.preventDefault();toCorridor()}
    else if(scene==='letter'){e.preventDefault();nextLetter()}
        else if(scene==='failed'){e.preventDefault();startBattle()}
  }
});
window.addEventListener('keyup',e=>{if(keyMap[e.code])keys[keyMap[e.code]]=false});window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(scene==='battle'&&!paused){paused=true;musicStop(false)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scene==='battle'&&!paused){paused=true;musicStop(false)}});
document.querySelectorAll('.padBtn').forEach(b=>{const k=b.dataset.key;if(!k)return;const off=e=>{keys[k]=false;b.classList.remove('on');try{if(e&&b.hasPointerCapture(e.pointerId))b.releasePointerCapture(e.pointerId)}catch(_){}};b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}});b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',()=>{keys[k]=false;b.classList.remove('on')})});
let resizeDelay=0;window.addEventListener('resize',()=>{clearTimeout(resizeDelay);resizeDelay=setTimeout(()=>{if(scene==='letter'){const old=letterPages[letterIndex],section=old?.section||0,offset=old?.offset||0;buildPages();const found=letterPages.findIndex(p=>p.section===section&&p.offset<=offset&&p.offset+p.text.length>offset);letterIndex=Math.max(0,found);showLetter()}},200)});

 const shapes={F:['11111','10000','11110','10000','10000','10000','10000'],r:['00000','00000','10110','11001','10000','10000','10000'],o:['00000','00000','01110','10001','10001','10001','01110'],m:['00000','00000','11010','10101','10101','10101','10101'],'.':['00000','00000','00000','00000','00000','00110','00110'],A:['01110','10001','10001','11111','10001','10001','10001']};
 const c=$('pixelLogo'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.fillStyle='#f8f8f8';let x=7;for(const k of 'From. A'){if(k===' '){x+=16;continue}const rows=shapes[k];if(!rows)continue;for(let y=0;y<rows.length;y++)for(let col=0;col<5;col++)if(rows[y][col]==='1')g.fillRect(x+col*4,7+y*4,4,4);x+=27} }
